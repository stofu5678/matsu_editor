[package]
name = "ume-ui"
description = "The GPUI window of UME Editor: the editor view, input, and the glue to the commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ume-core = { path = "../ume-core" }
ume-layout = { path = "../ume-layout" }
ume-commands = { path = "../ume-commands" }
ume-config = { path = "../ume-config" }
# The syntax coloring of the text: comments, strings, numbers, keywords (Sakura's color strategies).
ume-coloring = { path = "../ume-coloring" }
ume-platform = { path = "../ume-platform" }
# The analyzers of the outline pane (Sakura's アウトライン解析).
ume-outline = { path = "../ume-outline" }
ume-print = { path = "../ume-print" }
# The regular expression option of the find and replace panel (ADR-0006).
ume-regex = { path = "../ume-regex" }
# The macro host and the bridge from a macro's calls to the commands (ADR-0007).
ume-plugin = { path = "../ume-plugin" }
# Carries the events of a running macro from the host's threads to the UI thread.
async-channel = "2"
# The UI commands register themselves like the core commands (ADR-0013 section 1).
inventory = "0.3.25"
# The times in the file property dialog, in the local time zone (as ume-commands does).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
gpui = { package = "gpui-pre", version = "=0.3.8" }
# Without these features GPUI runs headless on Linux.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["wayland", "x11"] }
# The root view and the title bar that the window draws itself on Wayland without server-side
# decorations (WSLg).
gpui-component = "=0.7.1"
# The actions and `ElementExt` that gpui-component's own menu bar uses (the version it depends on).
# Our menu bar (`menu_bar.rs`) needs them; gpui-component does not re-export them.
gpui-base = "=0.7.2"
# The OS window under a GPUI window, for the window functions (src/window_ops).
raw-window-handle = "0.6"
# The icons that gpui-component draws (the check mark of a check box, the arrows of menus, the
# title bar buttons). Without them a checked box is a filled square on every OS.
gpui-kit-assets = "=0.7.2"

# macOS: without font-kit, GPUI draws no text at all. runtime_shaders compiles the Metal
# shaders when the app starts, so the build does not need Xcode's Metal Toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }

[dev-dependencies]
tempfile = "3.27"
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
