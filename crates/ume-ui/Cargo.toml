[package]
name = "ume-ui"
description = "The GPUI window of UME Editor: the editor view, input, and the glue to the commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ume-core = { path = "../ume-core" }
ume-layout = { path = "../ume-layout" }
ume-commands = { path = "../ume-commands" }
# The UI commands register themselves like the core commands (ADR-0013 section 1).
inventory = "0.3.25"
gpui = { package = "gpui-pre", version = "=0.3.8" }
# Without these features GPUI runs headless on Linux.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["wayland", "x11"] }
# The root view and the title bar that the window draws itself on Wayland without server-side
# decorations (WSLg).
gpui-component = "=0.7.1"

# macOS: without font-kit, GPUI draws no text at all. runtime_shaders compiles the Metal
# shaders when the app starts, so the build does not need Xcode's Metal Toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }

# The icons of the title bar buttons.
[target.'cfg(target_os = "linux")'.dependencies]
gpui-kit-assets = "=0.7.1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
