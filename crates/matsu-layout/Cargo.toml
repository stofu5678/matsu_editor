[package]
name = "matsu-layout"
description = "UI-independent line layout of MATSU Editor: wrapping, tabs, and column mapping as Sakura Editor does"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# For the measurement of docs/measurements/long-line-normal.md (matsu-core's src/measure.rs).
[features]
measure = ["matsu-core/measure"]

[dependencies]
matsu-core = { path = "../matsu-core" }
unicode-width = "0.2"

[lints]
workspace = true
