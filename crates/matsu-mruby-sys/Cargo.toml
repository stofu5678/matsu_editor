[package]
name = "matsu-mruby-sys"
description = "mruby 4.0 (MIT) compiled from the C source that the crate carries, with a small safe interface to run a script and bind host functions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
cc = "1"

# The FFI needs unsafe code; the rest of the workspace denies it.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
