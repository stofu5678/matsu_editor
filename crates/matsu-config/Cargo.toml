[package]
name = "matsu-config"
description = "Reads and writes Sakura Editor's settings file (sakura.ini) without losing data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Shift_JIS (Windows-31J) decoding and encoding for sakura.ini files that have no BOM.
encoding_rs = "0.8.35"
# The SHA-256 of the files of a plugin when the user enables it (ADR-0026, chapter 4). Already in Cargo.lock.
sha2 = "0.11"
# Sakura's print settings (`[Print]`) are read into the types of the print layout.
matsu-print = { path = "../matsu-print" }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true

# Plain fsync when the file system has no F_FULLFSYNC (src/sync.rs).
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"
