[package]
name = "ume-platform"
description = "The OS-specific parts of UME Editor that GPUI does not have: printing, file dialogs with a start folder, and window placement on macOS, Windows and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ume-print = { path = "../ume-print" }
# The font of the font dialog (src/font_dialog) goes in and out as the settings file keeps it.
ume-config = { path = "../ume-config" }
# The window of the OS under a GPUI window, for the window functions (src/window).
raw-window-handle = "0.6"

# Printing to a PDF (src/print/pdf.rs): what Linux prints, and the PDF of the tests.
[target.'cfg(not(target_os = "macos"))'.dependencies]
krilla = "0.8.2"

# Linux: the print portal over D-Bus, through the crate and the version that GPUI uses.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
tempfile = "3.27"
# The deletion date in the info file of the trash (src/trash/unix.rs), in the local time zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# macOS and Linux: the user id, to check that the socket directory is the user's (src/instance/unix.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The file dialogs wait for a thread (Windows) or AppKit's completion handler (macOS).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
futures-channel = "0.3"

[target.'cfg(windows)'.dependencies]
# The file dialogs (src/dialog) and the known folders (src/folders): COM, which windows-sys has no
# interfaces for. The version GPUI uses.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# The `implement` macro names this crate in what it writes, so it must be a dependency of ours.
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
    # The named pipe of src/instance/windows.rs: the user's SID in its security descriptor.
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_Controls_Dialogs",
    # ShellExecuteW (src/shell/windows.rs)
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # LoadLibraryW and GetProcAddress for HtmlHelp (src/help/windows.rs)
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSFileManager", "NSGeometry", "NSObject", "NSRange", "NSString", "NSURL", "NSDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "block2",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSPopUpButton",
    "NSStackView",
    "NSTextField",
    "NSUserInterfaceLayout",
    "NSGraphicsContext",
    "NSOpenPanel",
    "NSPanel",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSPrintPanel",
    "NSPrinter",
    "NSResponder",
    "NSSavePanel",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFAttributedString", "CFCGTypes", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGContext", "CGFont"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "CTFont", "CTLine", "CTRun", "CTStringAttributes"] }

[dev-dependencies]
tempfile = "3.27"

# UI Automation, to drive the native dialogs in tests/windows_*_dialog.rs. These features are added
# to the ones of `[target.'cfg(windows)'.dependencies]` above (Cargo unions them).
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    # CB_SETCURSEL and the notification of the classic font dialog (tests/common)
    "Win32_UI_WindowsAndMessaging",
    # SendInput: typing the file name into the save dialog (tests/common)
    "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true
