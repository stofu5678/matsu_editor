[package]
name = "matsu-regex"
description = "Regular expressions for MATSU Editor: Onigmo (as in Sakura's bregonig.dll) behind a trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
matsu-core = { path = "../matsu-core" }

[dev-dependencies]
serde_json = "1"

[build-dependencies]
cc = "1"

# The measuring program of ADR-0020, 8.1 (run by hand, or by the manual workflow huge-measure.yml). It is here
# because it needs the matcher of this crate and the file code of matsu-core. `test = true` runs its unit tests.
[[example]]
name = "huge_measure"
path = "examples/huge_measure/main.rs"
test = true

[lints]
workspace = true
