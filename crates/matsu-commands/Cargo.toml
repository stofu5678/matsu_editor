[package]
name = "matsu-commands"
description = "Named commands of MATSU Editor, with Sakura's command, key binding and menu tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Hooks for the tests of other crates (`clipboard::with_copy_limit`); never on in a release.
test-util = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
inventory = "0.3.25"
matsu-core = { path = "../matsu-core" }
matsu-layout = { path = "../matsu-layout" }
