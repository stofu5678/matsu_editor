[package]
name = "gpui-textview-poc"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Throwaway PoC for ADR-0004; kept out of the main workspace.
[workspace]

[features]
# Adds `--self-check <dir>` (src/self_check.rs), which presses the keys, saves what the window
# shows as PNG files, and quits. GPUI renders a window to an image only with its test support.
self-check = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "dep:anyhow",
    "dep:image",
    "dep:cocoa",
    "dep:objc",
    "dep:raw-window-handle",
]

[dependencies]
anyhow = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
gpui = { package = "gpui-pre", version = "=0.3.8" }
# Without these features GPUI runs headless on Linux.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["wayland", "x11"] }
gpui-component = "=0.7.1"
gpui-base = "=0.7.1"
zlog = { package = "gpui-pre-zlog", version = "=0.3.8" }

# macOS: without font-kit, GPUI draws no text at all. runtime_shaders compiles the Metal
# shaders when the app starts, so the build does not need Xcode's Metal Toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }
# For the self-check only, which posts macOS key events. GPUI uses the same crates.
cocoa = { version = "0.26", optional = true }
objc = { version = "0.2", optional = true }
raw-window-handle = { version = "0.6", optional = true }

# Linux: the icons of the title bar buttons that the window draws itself on Wayland without
# server-side decorations (WSLg).
[target.'cfg(target_os = "linux")'.dependencies]
gpui-kit-assets = "=0.7.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
