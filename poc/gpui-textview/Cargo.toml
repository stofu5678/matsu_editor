[package]
name = "gpui-textview-poc"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
# `cargo run` starts the editor; src/bin/minimal.rs needs `--bin minimal`.
default-run = "gpui-textview-poc"

# Throwaway PoC for ADR-0004; kept out of the main workspace.
[workspace]

[features]
# Adds `--self-check <dir>` (src/self_check.rs), which presses the keys, saves what the window
# shows as PNG files, and quits. GPUI renders a window to an image only with its test support.
self-check = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "dep:anyhow",
    "dep:image",
    "dep:cocoa",
    "dep:objc",
]

[dependencies]
anyhow = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
gpui = { package = "gpui-pre", version = "=0.3.8" }
# Without these features GPUI runs headless on Linux.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["wayland", "x11"] }
gpui-component = "=0.7.1"
gpui-base = "=0.7.1"
zlog = { package = "gpui-pre-zlog", version = "=0.3.8" }
# The width of characters in the print layout (src/print/layout.rs).
unicode-width = "0.2"
# The macro host (src/macro_host/): JSON-RPC messages, a channel from the reader threads to the UI,
# and a private directory for the boot files. Linux printing also uses tempfile (src/print/linux.rs).
serde_json = "1"
async-channel = "2"
tempfile = "3.27"

# macOS: without font-kit, GPUI draws no text at all. runtime_shaders compiles the Metal
# shaders when the app starts, so the build does not need Xcode's Metal Toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }
# For the self-check only, which posts macOS key events. GPUI uses the same crates.
cocoa = { version = "0.26", optional = true }
objc = { version = "0.2", optional = true }
# Printing (src/print/mac.rs): AppKit's print panel and Core Text, through the crates and the
# versions that GPUI uses.
raw-window-handle = "0.6"
futures-channel = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSObject", "NSRange", "NSString", "NSURL", "NSDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "NSGraphicsContext",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSPrintPanel",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFAttributedString", "CFCGTypes", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGFont",
    "CGImage",
    "CGPDFDocument",
    "CGPDFPage",
] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "CTFont", "CTLine", "CTRun", "CTStringAttributes"] }

# Linux: the icons of the title bar buttons that the window draws itself on Wayland without
# server-side decorations (WSLg).
[target.'cfg(target_os = "linux")'.dependencies]
gpui-kit-assets = "=0.7.1"
# Printing (src/print/linux.rs): the print portal over D-Bus, through the crate and the version
# that GPUI uses.
zbus = { version = "5.19", default-features = false, features = ["async-io"] }

# Printing to PDF (src/print/pdf.rs): what Linux prints, and `--print-pdf`.
[target.'cfg(not(target_os = "macos"))'.dependencies]
krilla = "0.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    # Printing (src/print/windows.rs)
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_Controls_Dialogs",
] }
# The window that owns the print dialog.
raw-window-handle = "0.6"
