[package]
name = "xtask"
description = "Repository tasks (cargo xtask): the generator for the Sakura tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The Markdown parser that mdBook 0.5.4 uses (mdbook-markdown asks for ^0.13.4; 0.13.4 has RUSTSEC-2026-0414 and
# 0.13.6 is the newest 0.13), so that the help check reads
# pages the way the book does. No default features: no command-line tool, no SIMD, no HTML writer.
pulldown-cmark = { version = "=0.13.6", default-features = false }
