[files]
extend-exclude = [
    "*.lock",
    "*.diff",
    # The license texts and notices of the dependencies, as they wrote them (generated by cargo-about).
    "THIRD_PARTY_NOTICES.txt",
    # Vendored C sources of the embedded script engines (mruby, MicroPython) and their generated files.
    "vendor/",
    # Vendored Onigmo (C sources and Unicode tables) and the test table generated from its testpy.py.
    "crates/ume-regex/onigmo/",
    "crates/ume-regex/src/onigmo_suite/cases.rs",
    # What bregonig.dll returned for the cases, byte for byte (the outputs include odd text on purpose).
    "tools/bregonig-compat/bregonig-4.20-*.json",
    # Test strings for the regex engine (subjects like "ba" are not words).
    "tools/bregonig-compat/cases.json",
    "tools/bregonig-compat/make_cases.py",
    # Sakura's keyword sets, word for word (TeX commands, COBOL words and so on are not English).
    "crates/ume-config/src/settings/keyword_data/",
]

[default.extend-words]
# cpy: a COBOL copybook extension in the built-in document type (sakura_core/types/CType_Cobol.cpp).
cpy = "cpy"

# mak: the extension of makefiles in the table of ctags kinds (CDlgTagJumpList.cpp).
mak = "mak"

# fo: the start of "foo" in the tag jump tests (a keyword that is searched by its beginning).
fo = "fo"

# bb.edn: Babashka's config file (EDN, the Extensible Data Notation of Clojure).
edn = "edn"

# bregonig.dll's own error message "unmatch separater" (a pattern that ends with a backslash).
separater = "separater"

# GAE: a name in the copyright notice of a ported file (CEditView_ExecCmd.cpp).
GAE = "GAE"

[default.extend-identifiers]
# Sakura's macro names (sakura_core/macro/CSMacroMgr.cpp): "UNICODE to SJIS" written as a word.
CodeCnvUNICODEtoSJIS = "CodeCnvUNICODEtoSJIS"
CodeCnvUNICODEBEtoSJIS = "CodeCnvUNICODEBEtoSJIS"
# The key of Sakura's settings file for "copy, then drop the selection" (CShareData_IO.cpp), spelled so.
bCopyAndDisablSelection = "bCopyAndDisablSelection"
