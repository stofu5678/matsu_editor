version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      # The ref is the Rust version; it must match rust-toolchain.toml.
      - dependency-name: dtolnay/rust-toolchain
