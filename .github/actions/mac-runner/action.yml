name: Pick the macOS runner
description: >-
  Picks the runner of the macOS jobs (ADR-0027): the self-hosted runner in the VM on the maintainer's Mac, or GitHub's
  macos-15. Fails closed: anything missing or malformed means GitHub's runner.

# Used by the `changes` job of ci.yml and the `mac-runner` job of package.yml. The two callers share this one
# script, so there is nothing to keep in step by hand. The caller passes the values in as inputs (its own `vars` and
# `github` contexts), and this action only reads them.
#
# - The repository variables are not passed to a workflow run for a pull request from a fork, so a fork gets
#   GitHub's runner by itself; the repository ID check says so again, in case that ever changes.
# - mac-runner-seen is the time (UNIX seconds) at which the Mac last said that the runner is alive. When it is older
#   than 15 minutes (the Mac is closed or off), CI falls back to GitHub's runner without anybody switching
#   MAC_RUNNER. A run reads the variables as they were when it was created, so for a run that waited before this
#   job (release.yml waits for the run before it) the heartbeat counts against head-commit-time, the time of the
#   pushed commit, if GitHub made that commit and it is at most 2 hours old (2026-11-08, ADR-0027).
# - This is for convenience. The protection is the job-started hook inside the VM (tools/mac-runner/guest/admit.sh),
#   which refuses any other repository, event, workflow and job, and which a workflow cannot change.

inputs:
  mac-runner:
    description: The repository variable MAC_RUNNER
    required: false
    default: ''
  mac-runner-seen:
    description: The repository variable MAC_RUNNER_SEEN
    required: false
    default: ''
  event:
    description: github.event_name
    required: true
  head-repo-id:
    description: github.event.pull_request.head.repo.id
    required: false
    default: ''
  repo-id:
    description: github.repository_id
    required: true
  head-commit-time:
    description: >-
      github.event.head_commit.timestamp: for a push, the time of the pushed commit (ISO 8601), a few seconds before
      the run was created; empty for a pull request
    required: false
    default: ''
  head-commit-committer:
    description: >-
      github.event.head_commit.committer.email: noreply@github.com when GitHub made the pushed commit (a merge)
    required: false
    default: ''

outputs:
  mac:
    description: The value for runs-on, as JSON (a string or an array of labels)
    value: ${{ steps.pick.outputs.mac }}
  mac_kind:
    description: self-hosted or github
    value: ${{ steps.pick.outputs.mac_kind }}

runs:
  using: composite
  steps:
    - id: pick
      shell: bash
      env:
        MAC_RUNNER: ${{ inputs.mac-runner }}
        MAC_RUNNER_SEEN: ${{ inputs.mac-runner-seen }}
        EVENT: ${{ inputs.event }}
        HEAD_REPO_ID: ${{ inputs.head-repo-id }}
        REPO_ID: ${{ inputs.repo-id }}
        HEAD_COMMIT_TIME: ${{ inputs.head-commit-time }}
        HEAD_COMMIT_COMMITTER: ${{ inputs.head-commit-committer }}
      # The rules are in pick.sh, which pick-test.sh tests (the lint job of ci.yml runs it).
      run: bash "${GITHUB_ACTION_PATH}/pick.sh"
