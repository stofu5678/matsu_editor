name: Package

# Reusable workflow: build `matsu` and `matsu-script` in release mode on the five targets and package them.
# It publishes nothing. The caller decides what to do with the artifacts
# (docs/release.md). Archive names are `matsu-<target>.zip` (Windows) or
# `matsu-<target>.tar.gz`; the caller adds the nightly or version label.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (default is the commit of the calling run)
        type: string
        default: ''
      artifact-prefix:
        description: Prefix of the artifact names
        type: string
        default: package

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Both jobs have a time limit (timeout-minutes) instead of GitHub's default of 6 hours; the jobs of release.yml and
# package-check.yml that call this workflow cannot set one, so a new job here needs its own. On 2026-11-06
# `apt-get update` in package (linux-x64) printed nothing for those 6 hours (.github/scripts/apt-install.sh now cuts
# it off and tries again); the nightly was not published, and the next run of release.yml waited behind it in the
# `release` group. The limit of package is more than three times its longest successful run in the weeks before
# 2026-11-07 (17 minutes), because a release whose package runs out of time is not published.
jobs:
  # Picks the runner of package (macos-arm64) (ADR-0027): the self-hosted runner in the VM on the maintainer's Mac,
  # or GitHub's macos-15. The rules are in .github/actions/mac-runner/action.yml, the same as for ci.yml. The VM
  # runs only a push to main (release.yml) and a pull request from this repository (package-check.yml); the
  # job-started hook inside the VM refuses everything else. Unlike ci.yml this is a job of its own, a few seconds on
  # a Linux runner, because a job's `runs-on` cannot read a step of the same job. It has no secrets.
  mac-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mac: ${{ steps.mac.outputs.mac }}
      mac_kind: ${{ steps.mac.outputs.mac_kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: mac
        uses: ./.github/actions/mac-runner
        with:
          mac-runner: ${{ vars.MAC_RUNNER }}
          mac-runner-seen: ${{ vars.MAC_RUNNER_SEEN }}
          event: ${{ github.event_name }}
          head-repo-id: ${{ github.event.pull_request.head.repo.id }}
          repo-id: ${{ github.repository_id }}

  package:
    name: package (${{ matrix.name }})
    needs: mac-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-arm64, os: windows-11-arm }
          - { name: windows-x64, os: windows-2025 }
          - { name: macos-arm64, os: macos-15 }
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    # Only the macOS job takes its runner from the mac-runner job; the other four keep matrix.os.
    runs-on: ${{ matrix.name == 'macos-arm64' && fromJSON(needs.mac-runner.outputs.mac) || matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.99.0
      # Same list as ci.yml (GPUI links the system libraries of the Linux desktop).
      - name: Install the packages that GPUI needs
        if: runner.os == 'Linux'
        run: |
          .github/scripts/apt-install.sh build-essential clang cmake \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev
      # The VM has its own SDK and tools, and what it builds is not trusted as much as what GitHub's runner builds, so
      # its cache must not mix with the one of GitHub's runners (ADR-0027).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name == 'macos-arm64' && needs.mac-runner.outputs.mac_kind == 'self-hosted' && 'release-vm' || 'release' }}
      # `matsu-script` runs the macros of the bundled engines (Lua, QuickJS, mruby, MicroPython);
      # the editor looks for it next to its own executable (crates/matsu-plugin/src/session.rs).
      - run: cargo build --release --locked -p matsu -p matsu-script
      # freetype-sys bundles FreeType (FTL, not covered by THIRD_PARTY_NOTICES.txt) when the system
      # has none. The Linux packages must link the system's, as ci.yml checks for the tests.
      # The C runtime is linked into the programs (.cargo/config.toml), so that they start on a Windows without
      # the Visual C++ Redistributable.
      - name: Check that the programs do not need the C runtime DLLs
        if: runner.os == 'Windows'
        run: python .github/scripts/pe_imports.py target/release/matsu.exe target/release/matsu-script.exe
      - name: Check that FreeType was not bundled
        if: runner.os == 'Linux'
        run: |
          if find target -name 'libfreetype2.a' | grep -q .; then
            echo "::error::freetype-sys built its bundled FreeType. Install libfreetype-dev."
            exit 1
          fi
      - name: Stage the files
        env:
          TARGET: ${{ matrix.name }}
          SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          dir="matsu-$TARGET"
          mkdir -p "dist/$dir"
          # THIRD_PARTY_NOTICES.txt goes next to the programs: the licenses of the code they include
          # ask for it (README.md, "Third-party notices").
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.txt "dist/$dir/"
          if [ "$RUNNER_OS" = macOS ]; then
            # An app bundle, so that Finder opens it without a Terminal window (a bare executable
            # makes Terminal.app run it). Both programs are inside it.
            scripts/package-mac-app.sh target/release "dist/$dir"
          else
            cp "target/release/matsu$SUFFIX" "target/release/matsu-script$SUFFIX" "dist/$dir/"
          fi
          # The icon of MATSU Editor as pictures (assets/icons/README.md); matsu.exe has its own copy inside.
          mkdir "dist/$dir/icons"
          cp assets/icons/*.svg assets/icons/*.png assets/icons/matsu_editor.ico "dist/$dir/icons/"
          {
            echo "MATSU Editor ($TARGET)"
            echo
            if [ "$RUNNER_OS" = macOS ]; then
              echo "Move \"MATSU Editor.app\" to Applications (or anywhere) and open it. It is signed ad hoc,"
              echo "not notarized, so the first time macOS may say it cannot check the developer. Then"
              echo "Control-click (right-click) the app and choose Open, or allow it in System Settings >"
              echo "Privacy & Security > Open Anyway. If macOS says the app is damaged (a browser adds a"
              echo "quarantine mark), remove it: xattr -dr com.apple.quarantine \"MATSU Editor.app\""
              echo "From a terminal: \"MATSU Editor.app/Contents/MacOS/matsu\" file.txt"
              echo "matsu-script (inside the app, next to matsu) runs the macros of the bundled languages"
              echo "(Lua, JavaScript, Ruby, Python); keep it there."
            else
              echo "Run matsu$SUFFIX with a file path. matsu-script$SUFFIX runs the macros of the bundled"
              echo "languages (Lua, JavaScript, Ruby, Python); keep it next to matsu$SUFFIX."
            fi
            echo "Licensed under MIT OR Apache-2.0 (LICENSE-MIT, LICENSE-APACHE)."
            echo "icons/ has the icon of MATSU Editor (MIT OR Apache-2.0, like the code)."
            echo "THIRD_PARTY_NOTICES.txt has the notices and licenses of the code the programs include."
            echo "https://github.com/${GITHUB_REPOSITORY}"
          } > "dist/$dir/README.txt"
      - name: Check the app bundle
        if: runner.os == 'macOS'
        working-directory: dist/matsu-macos-arm64
        run: |
          app="MATSU Editor.app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = io.github.stofu5678.matsu-editor
          test -x "$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")"
          test -x "$app/Contents/MacOS/matsu-script"
          test -f "$app/Contents/Resources/matsu_editor.icns"
          codesign --verify --deep --strict --verbose=2 "$app"
          file "$app/Contents/MacOS/matsu" "$app/Contents/Resources/matsu_editor.icns"
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: Compress-Archive -Path "matsu-${{ matrix.name }}" -DestinationPath "matsu-${{ matrix.name }}.zip"
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        working-directory: dist
        run: tar -czf "matsu-${{ matrix.name }}.tar.gz" "matsu-${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
