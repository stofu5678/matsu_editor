name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A draft runs nothing (the agents run the checks locally while they work on it); marking it ready runs
    # everything (ready_for_review). Required checks cannot pass on a draft, and a draft cannot be merged anyway.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job has a time limit (timeout-minutes) instead of GitHub's default of 6 hours, so that a job that hangs gives
# its runner back. A limit is at least 10 minutes, and at least one and a half times the longest successful run of the
# job in the weeks before 2026-11-07 (test: 39 minutes, linux-x64, while the apt mirror was slow); a job that gets more
# says why. The time a job waits for a runner does not count. The runner of test (macos-arm64) can be the one VM on the
# maintainer's Mac (ADR-0027), which runs nothing else while a job holds it.
jobs:
  # Tells whether a pull request changes more than documentation (Markdown files and docs/). The
  # test jobs below use it to stay off the macOS and Windows runners for a docs-only change: the
  # account runs 5 macOS jobs at a time, and with many pull requests open a test (macos-arm64)
  # waited 95 minutes for a runner and was cancelled (#199, a docs-only ADR). A workflow-level
  # `paths` filter would not do: the required checks would never report. Every other event
  # (push to main) counts as code.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      help: ${{ steps.files.outputs.help }}
      mac: ${{ steps.mac.outputs.mac }}
      mac_kind: ${{ steps.mac.outputs.mac_kind }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          help=true
          if [ "$EVENT" = pull_request ]; then
            # A rename lists the new path as `filename` and the old one as `previous_filename`; both
            # count, so moving code into docs/ or to a .md name is a code change.
            files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
            # The API lists at most 3000 files: a longer change may hide code, so it counts as code.
            count=$(printf '%s\n' "$files" | wc -l)
            if [ -n "$files" ] && [ "$count" -lt 3000 ] && ! printf '%s\n' "$files" | grep -Ev '(\.md$|^docs/)' > /dev/null; then
              code=false
            fi
            # The help job (below) runs for a change of the help, of its check (xtask), of the Sakura tables
            # whose names the check leaves out, or of its own files. A docs-only change to docs/help/ is one.
            # The same limit of 3000 files as above: a longer change counts.
            help=false
            if [ -n "$files" ] && [ "$count" -lt 3000 ]; then
              if printf '%s\n' "$files" | grep -E '^(docs/help/|xtask/|crates/matsu-commands/src/sakura/|\.github/scripts/help-|\.github/workflows/ci\.yml$)' > /dev/null; then
                help=true
              fi
            else
              help=true
            fi
            printf 'changed files:\n%s\n' "$files"
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "help=${help}" >> "$GITHUB_OUTPUT"

      # Picks the runner of test (macos-arm64) (ADR-0027): the self-hosted runner in the VM on the maintainer's Mac,
      # or GitHub's macos-15. It is a step of this job, not a job of its own, so that a pull request does not wait
      # for one more runner. The choice fails closed: anything missing or malformed means GitHub's runner. The rules
      # are in .github/actions/mac-runner/action.yml, which package.yml uses too. The checkout takes only that
      # folder; this job needs nothing else of the repository.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: mac
        uses: ./.github/actions/mac-runner
        with:
          mac-runner: ${{ vars.MAC_RUNNER }}
          mac-runner-seen: ${{ vars.MAC_RUNNER_SEEN }}
          event: ${{ github.event_name }}
          head-repo-id: ${{ github.event.pull_request.head.repo.id }}
          repo-id: ${{ github.repository_id }}
          head-commit-time: ${{ github.event.head_commit.timestamp }}
          head-commit-committer: ${{ github.event.head_commit.committer.email }}

  # The quick checks share one job and one runner. As six jobs they each ran for 2 minutes or less but waited 5
  # minutes or more for a runner of their own when several pull requests were open. Every step after the first runs
  # even if an earlier one failed, so that one run shows every problem.
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    # More than the rule above gives (18 minutes): installing the packages that GPUI needs took up to 9 minutes in
    # test (linux-x64) while the apt mirror was slow, and .github/scripts/apt-install.sh may try again.
    timeout-minutes: 45
    env:
      RUSTDOCFLAGS: -D warnings
      # Keep these two the same as in release.yml (it regenerates the notices in the release PR).
      CARGO_ABOUT_VERSION: 0.9.2
      # SHA-256 of the prebuilt cargo-about 0.9.2 (x86_64-unknown-linux-musl), from its release.
      CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - name: fmt
        run: cargo fmt --all --check
      - name: typos
        if: success() || failure()
        uses: crate-ci/typos@v1.52.0
      - name: actionlint
        if: success() || failure()
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      # The old product name must not come back (ADR-0021). This runs for every pull request, docs-only ones too: the
      # workspace tests are skipped for those, and a help page once brought the old katakana name back unseen.
      - name: old product name
        if: success() || failure()
        run: cargo run --locked --package xtask -- names-check
      # Which jobs the self-hosted runner in the VM on the maintainer's Mac lets run (ADR-0027). Bash and jq only.
      - name: mac-runner admission
        if: success() || failure()
        run: bash tools/mac-runner/tests/admit-test.sh
      # Which runner the macOS jobs get (ADR-0027, .github/actions/mac-runner/pick.sh). Bash and GNU date only.
      - name: mac-runner routing
        if: success() || failure()
        run: bash .github/actions/mac-runner/pick-test.sh
      # Licenses (no GPL family, see CLAUDE.md), advisories, and sources.
      - name: deny
        if: success() || failure()
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
      # THIRD_PARTY_NOTICES.txt is generated from Cargo.lock (README.md, "Third-party notices"). A
      # dependency update that is not followed by a regeneration fails here.
      - name: Install cargo-about
        if: success() || failure()
        run: |
          archive="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfL -o "${RUNNER_TEMP}/cargo-about.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${archive}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  ${RUNNER_TEMP}/cargo-about.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/cargo-about.tar.gz" -C "${RUNNER_TEMP}/bin" --strip-components=1 "${archive}/cargo-about"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: notices
        if: success() || failure()
        run: |
          cargo about generate --locked --all-features --workspace --fail about.hbs -o THIRD_PARTY_NOTICES.txt
          if ! git diff --exit-code -- THIRD_PARTY_NOTICES.txt; then
            echo "::error::THIRD_PARTY_NOTICES.txt is out of date. Run: cargo about generate --locked --all-features --workspace --fail about.hbs -o THIRD_PARTY_NOTICES.txt"
            exit 1
          fi
      # GPUI (matsu-ui) links the system libraries of the Linux desktop. The same list serves x64
      # and ARM64 (poc/gpui-textview/README.md).
      - name: Install the packages that GPUI needs
        if: success() || failure()
        run: |
          .github/scripts/apt-install.sh build-essential clang cmake \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev
      - uses: Swatinem/rust-cache@v2
        if: success() || failure()
      - name: doc
        if: success() || failure()
        run: cargo doc --workspace --no-deps --locked

  # The help in docs/help/ (ADR-0031): the book builds, Pagefind indexes its Japanese text, no link or anchor is
  # broken, and no run of text is shared with Sakura's help (GFDL, which must not be copied). The job is listed for
  # every change, so that it can be a required check; its steps run only when the help, its check (xtask), or the
  # Sakura tables whose names the check leaves out changed (the `help` output of the changes job). The tools are
  # release binaries of pinned versions with their SHA-256 (the digests on the GitHub releases), not `cargo
  # install`. The names of the variables avoid the prefixes MDBOOK_ and PAGEFIND_, which the tools read as settings.
  help:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: changes
    runs-on: ubuntu-24.04
    # About 3 minutes (the build of xtask takes seconds); the minimum of 10 from the rule above.
    timeout-minutes: 10
    env:
      HELP_MDBOOK_VERSION: 0.5.4
      # SHA-256 of mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz.
      HELP_MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
      HELP_PAGEFIND_VERSION: 1.6.0
      # SHA-256 of pagefind-v1.6.0-x86_64-unknown-linux-musl.tar.gz.
      HELP_PAGEFIND_SHA256: 004d40c9a644c995dadc42b8031196c6f17e7a6dacf9a6c15c63286dd6ead5f2
      # The Sakura commit that the tables in crates/matsu-commands/src/sakura/ were generated from (the first lines
      # of functions.rs name it). Only help/ and one resource file are read, never copied into the repository.
      HELP_SAKURA_COMMIT: 48db6c7c25e2d98bdf47baab201826b4da8c7303
    steps:
      - name: Nothing to check
        if: needs.changes.outputs.help != 'true'
        run: echo 'Neither docs/help/ nor its check changed.'
      - if: needs.changes.outputs.help == 'true'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.help == 'true'
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Install mdBook and Pagefind
        if: needs.changes.outputs.help == 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/help-bin"
          curl --proto '=https' --tlsv1.2 -sSfL -o "${RUNNER_TEMP}/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/v${HELP_MDBOOK_VERSION}/mdbook-v${HELP_MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HELP_MDBOOK_SHA256}  ${RUNNER_TEMP}/mdbook.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/mdbook.tar.gz" -C "${RUNNER_TEMP}/help-bin" mdbook
          curl --proto '=https' --tlsv1.2 -sSfL -o "${RUNNER_TEMP}/pagefind.tar.gz" \
            "https://github.com/Pagefind/pagefind/releases/download/v${HELP_PAGEFIND_VERSION}/pagefind-v${HELP_PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${HELP_PAGEFIND_SHA256}  ${RUNNER_TEMP}/pagefind.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/pagefind.tar.gz" -C "${RUNNER_TEMP}/help-bin" pagefind
          echo "${RUNNER_TEMP}/help-bin" >> "${GITHUB_PATH}"
      # Sakura's help and its resource file (the labels of the dialogs), at the pinned commit. git checks the hash
      # of what it fetches, so the commit pins the content.
      - name: Get Sakura's help
        if: needs.changes.outputs.help == 'true'
        run: |
          if ! grep -q "commit ${HELP_SAKURA_COMMIT}" crates/matsu-commands/src/sakura/functions.rs; then
            echo "::error::HELP_SAKURA_COMMIT is not the commit of the tables in crates/matsu-commands/src/sakura/. Change both."
            exit 1
          fi
          dir="${RUNNER_TEMP}/sakura"
          mkdir -p "$dir"
          git -C "$dir" init -q
          git -C "$dir" remote add origin https://github.com/sakura-editor/sakura.git
          git -C "$dir" sparse-checkout set --no-cone help sakura_core/sakura_rc.rc
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "${HELP_SAKURA_COMMIT}"
          git -C "$dir" checkout -q FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "${HELP_SAKURA_COMMIT}"
          echo "SAKURA_DIR=${dir}" >> "${GITHUB_ENV}"
      # Every step after the first runs even if an earlier one failed, so that one run shows every problem.
      - name: Tests of the checks
        if: needs.changes.outputs.help == 'true'
        run: cargo test -p xtask --locked -- help_
      - name: Links, and text shared with Sakura's help
        if: needs.changes.outputs.help == 'true' && (success() || failure())
        run: cargo xtask help-check --sakura "$SAKURA_DIR"
      - name: Build the book
        id: book
        if: needs.changes.outputs.help == 'true' && (success() || failure())
        run: |
          mdbook build docs/help
          site=target/help
          if [ -f target/help/html/index.html ]; then site=target/help/html; fi
          for page in index.html about.html print.html; do
            test -f "${site}/${page}" || { echo "::error::${site}/${page} was not built"; exit 1; }
          done
          echo "site=${site}" >> "${GITHUB_OUTPUT}"
      # Pagefind reads the built pages and writes its index into the folder. Only <main> (the page itself, not the
      # sidebar) is indexed; the language is set so that the Japanese text is split into words for the index.
      - name: Index the book with Pagefind
        if: needs.changes.outputs.help == 'true' && steps.book.outcome == 'success'
        run: |
          pagefind --site "${{ steps.book.outputs.site }}" --root-selector main --force-language ja
          python3 .github/scripts/help-check-index.py "${{ steps.book.outputs.site }}" 'このヘルプについて'

  # The matrix keeps its five jobs (and their names, which are required checks) for a docs-only
  # change too: a skipped matrix job would report under the unexpanded name and the required
  # check would wait forever. Instead every job runs on a small Linux runner and its steps are
  # skipped, so it ends green in a few seconds.
  test:
    name: test (${{ matrix.name }})
    needs: changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-arm64, os: windows-11-arm }
          - { name: windows-x64, os: windows-2025 }
          - { name: macos-arm64, os: macos-15 }
          # GitHub's x64 Ubuntu image has Node.js (22.23, which runs .ts files), PowerShell 7, Perl, Python, Ruby and PHP: the macro tests must run
          # there instead of skipping a missing interpreter.
          - { name: linux-x64, os: ubuntu-24.04, require_interpreters: '1' }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    # Only the macOS job takes its runner from the changes job (ADR-0027); the other four keep matrix.os.
    runs-on: ${{ needs.changes.outputs.code == 'true' && (matrix.name == 'macos-arm64' && fromJSON(needs.changes.outputs.mac) || matrix.os) || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Docs only, nothing to test
        if: needs.changes.outputs.code != 'true'
        run: echo 'Only Markdown files and docs/ changed.'
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      # GPUI (matsu-ui) links the system libraries of the Linux desktop. The same list serves x64
      # and ARM64 (poc/gpui-textview/README.md).
      # The runner images have no Emacs, which the Emacs Lisp macro tests need (Ubuntu 24.04 has
      # Emacs 29.3, built with JSON support). Without it they skip. The other OSes skip them: an
      # install through brew or choco costs minutes on runners that are scarce or slow already.
      # One call of the script for both, so that apt reads the package lists once.
      - name: Install the packages that GPUI needs, and Emacs for the Emacs Lisp macro tests
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          .github/scripts/apt-install.sh build-essential clang cmake \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev \
            emacs-nox
      # The VM has its own SDK and tools, so its cache must not mix with GitHub's macOS runner (ADR-0027). An empty
      # key adds nothing to the cache name (rust-cache config.ts: `if (inputKey)`), so every other job keeps its name.
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name == 'macos-arm64' && needs.changes.outputs.mac_kind == 'self-hosted' && 'vm' || '' }}
      - if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --locked
      - if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked
        env:
          MATSU_REQUIRE_INTERPRETERS: ${{ matrix.require_interpreters }}
      # freetype-sys bundles FreeType (FTL, not covered by THIRD_PARTY_NOTICES.txt) when the system
      # has none. The Linux builds must link the system's.
      - name: Check that FreeType was not bundled
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          if find target -name 'libfreetype2.a' | grep -q .; then
            echo "::error::freetype-sys built its bundled FreeType. Install libfreetype-dev."
            exit 1
          fi
