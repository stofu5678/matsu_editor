name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A draft runs nothing (the agents run the checks locally while they work on it); marking it ready runs
    # everything (ready_for_review). Required checks cannot pass on a draft, and a draft cannot be merged anyway.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Tells whether a pull request changes more than documentation (Markdown files and docs/). The
  # test jobs below use it to stay off the macOS and Windows runners for a docs-only change: the
  # account runs 5 macOS jobs at a time, and with many pull requests open a test (macos-arm64)
  # waited 95 minutes for a runner and was cancelled (#199, a docs-only ADR). A workflow-level
  # `paths` filter would not do: the required checks would never report. Every other event
  # (push to main) counts as code.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      mac: ${{ steps.mac.outputs.mac }}
      mac_kind: ${{ steps.mac.outputs.mac_kind }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            # A rename lists the new path as `filename` and the old one as `previous_filename`; both
            # count, so moving code into docs/ or to a .md name is a code change.
            files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
            # The API lists at most 3000 files: a longer change may hide code, so it counts as code.
            count=$(printf '%s\n' "$files" | wc -l)
            if [ -n "$files" ] && [ "$count" -lt 3000 ] && ! printf '%s\n' "$files" | grep -Ev '(\.md$|^docs/)' > /dev/null; then
              code=false
            fi
            printf 'changed files:\n%s\n' "$files"
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      # Picks the runner of test (macos-arm64) (ADR-0027): the self-hosted runner in the VM on the maintainer's Mac,
      # or GitHub's macos-15. It is a step of this job, not a job of its own, so that a pull request does not wait
      # for one more runner. The choice fails closed: anything missing or malformed means GitHub's runner.
      # - The repository variables are not passed to a workflow run for a pull request from a fork, so a fork gets
      #   GitHub's runner by itself; the repository ID check below says so again, in case that ever changes.
      # - MAC_RUNNER_SEEN is the time (UNIX seconds) at which the Mac last said that the runner is alive. When it is
      #   older than 15 minutes (the Mac is closed or off), CI falls back to GitHub's runner without anybody
      #   switching MAC_RUNNER.
      # - This is for convenience. The protection is the job-started hook inside the VM, which refuses any other
      #   repository, event, workflow and job, and which a workflow cannot change.
      - id: mac
        env:
          MAC_RUNNER: ${{ vars.MAC_RUNNER }}
          MAC_RUNNER_SEEN: ${{ vars.MAC_RUNNER_SEEN }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          reason=
          if [ "${MAC_RUNNER}" != self-hosted ]; then
            reason="MAC_RUNNER is '${MAC_RUNNER}', not 'self-hosted'"
          elif ! [[ "${REPO_ID}" =~ ^[0-9]{1,20}$ ]]; then
            reason="the repository ID is missing or malformed ('${REPO_ID}')"
          elif [ "${EVENT}" = push ]; then
            :
          elif [ "${EVENT}" != pull_request ]; then
            reason="the event is '${EVENT}', not push or pull_request"
          elif [ "${HEAD_REPO_ID}" != "${REPO_ID}" ]; then
            reason="the pull request comes from another repository ('${HEAD_REPO_ID}')"
          fi
          if [ -z "${reason}" ]; then
            now=$(date +%s)
            if ! [[ "${MAC_RUNNER_SEEN}" =~ ^[0-9]{1,12}$ ]]; then
              reason="MAC_RUNNER_SEEN is missing or not a number ('${MAC_RUNNER_SEEN}')"
            elif [ $((10#${MAC_RUNNER_SEEN})) -lt $((now - 900)) ]; then
              reason="MAC_RUNNER_SEEN is older than 15 minutes ($((now - 10#${MAC_RUNNER_SEEN})) seconds)"
            elif [ $((10#${MAC_RUNNER_SEEN})) -gt $((now + 60)) ]; then
              reason="MAC_RUNNER_SEEN is in the future ($((10#${MAC_RUNNER_SEEN} - now)) seconds ahead)"
            fi
          fi
          if [ -z "${reason}" ]; then
            echo 'macOS runner: self-hosted (MAC_RUNNER=self-hosted, seen recently)'
            echo 'mac=["self-hosted","matsu-vm"]' >> "$GITHUB_OUTPUT"
            echo 'mac_kind=self-hosted' >> "$GITHUB_OUTPUT"
          else
            echo "macOS runner: GitHub's macos-15, because ${reason}"
            echo 'mac="macos-15"' >> "$GITHUB_OUTPUT"
            echo 'mac_kind=github' >> "$GITHUB_OUTPUT"
          fi

  # The quick checks share one job and one runner. As six jobs they each ran for 2 minutes or less but waited 5
  # minutes or more for a runner of their own when several pull requests were open. Every step after the first runs
  # even if an earlier one failed, so that one run shows every problem.
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
      # Keep these two the same as in release.yml (it regenerates the notices in the release PR).
      CARGO_ABOUT_VERSION: 0.9.2
      # SHA-256 of the prebuilt cargo-about 0.9.2 (x86_64-unknown-linux-musl), from its release.
      CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - name: fmt
        run: cargo fmt --all --check
      - name: typos
        if: success() || failure()
        uses: crate-ci/typos@v1.51.1
      - name: actionlint
        if: success() || failure()
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      # Licenses (no GPL family, see CLAUDE.md), advisories, and sources.
      - name: deny
        if: success() || failure()
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
      # THIRD_PARTY_NOTICES.txt is generated from Cargo.lock (README.md, "Third-party notices"). A
      # dependency update that is not followed by a regeneration fails here.
      - name: Install cargo-about
        if: success() || failure()
        run: |
          archive="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfL -o "${RUNNER_TEMP}/cargo-about.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${archive}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  ${RUNNER_TEMP}/cargo-about.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/cargo-about.tar.gz" -C "${RUNNER_TEMP}/bin" --strip-components=1 "${archive}/cargo-about"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: notices
        if: success() || failure()
        run: |
          cargo about generate --locked --all-features --workspace --fail about.hbs -o THIRD_PARTY_NOTICES.txt
          if ! git diff --exit-code -- THIRD_PARTY_NOTICES.txt; then
            echo "::error::THIRD_PARTY_NOTICES.txt is out of date. Run: cargo about generate --locked --all-features --workspace --fail about.hbs -o THIRD_PARTY_NOTICES.txt"
            exit 1
          fi
      # GPUI (matsu-ui) links the system libraries of the Linux desktop. The same list serves x64
      # and ARM64 (poc/gpui-textview/README.md).
      - name: Install the packages that GPUI needs
        if: success() || failure()
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang cmake \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev
      - uses: Swatinem/rust-cache@v2
        if: success() || failure()
      - name: doc
        if: success() || failure()
        run: cargo doc --workspace --no-deps --locked

  # The matrix keeps its five jobs (and their names, which are required checks) for a docs-only
  # change too: a skipped matrix job would report under the unexpanded name and the required
  # check would wait forever. Instead every job runs on a small Linux runner and its steps are
  # skipped, so it ends green in a few seconds.
  test:
    name: test (${{ matrix.name }})
    needs: changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-arm64, os: windows-11-arm }
          - { name: windows-x64, os: windows-2025 }
          - { name: macos-arm64, os: macos-15 }
          # GitHub's x64 Ubuntu image has Node.js (22.23, which runs .ts files), PowerShell 7, Perl, Python, Ruby and PHP: the macro tests must run
          # there instead of skipping a missing interpreter.
          - { name: linux-x64, os: ubuntu-24.04, require_interpreters: '1' }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    # Only the macOS job takes its runner from the changes job (ADR-0027); the other four keep matrix.os.
    runs-on: ${{ needs.changes.outputs.code == 'true' && (matrix.name == 'macos-arm64' && fromJSON(needs.changes.outputs.mac) || matrix.os) || 'ubuntu-24.04' }}
    steps:
      - name: Docs only, nothing to test
        if: needs.changes.outputs.code != 'true'
        run: echo 'Only Markdown files and docs/ changed.'
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      # GPUI (matsu-ui) links the system libraries of the Linux desktop. The same list serves x64
      # and ARM64 (poc/gpui-textview/README.md).
      - name: Install the packages that GPUI needs
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang cmake \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev
      # The runner images have no Emacs, which the Emacs Lisp macro tests need (Ubuntu 24.04 has
      # Emacs 29.3, built with JSON support). Without it they skip. The other OSes skip them: an
      # install through brew or choco costs minutes on runners that are scarce or slow already.
      - name: Install Emacs for the Emacs Lisp macro tests
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: sudo apt-get install --no-install-recommends -y emacs-nox
      # The VM has its own SDK and tools, so its cache must not mix with GitHub's macOS runner (ADR-0027). An empty
      # key adds nothing to the cache name (rust-cache config.ts: `if (inputKey)`), so every other job keeps its name.
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name == 'macos-arm64' && needs.changes.outputs.mac_kind == 'self-hosted' && 'vm' || '' }}
      - if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --locked
      - if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked
        env:
          MATSU_REQUIRE_INTERPRETERS: ${{ matrix.require_interpreters }}
      # freetype-sys bundles FreeType (FTL, not covered by THIRD_PARTY_NOTICES.txt) when the system
      # has none. The Linux builds must link the system's.
      - name: Check that FreeType was not bundled
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          if find target -name 'libfreetype2.a' | grep -q .; then
            echo "::error::freetype-sys built its bundled FreeType. Install libfreetype-dev."
            exit 1
          fi
