name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Licenses (no GPL family, see CLAUDE.md), advisories, and sources.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  typos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.51.1

  doc:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      # GPUI (ume-ui) links the system libraries of the Linux desktop. The same list serves x64
      # and ARM64 (poc/gpui-textview/README.md).
      - name: Install the packages that GPUI needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang cmake \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-arm64, os: windows-11-arm }
          - { name: windows-x64, os: windows-2025 }
          - { name: macos-arm64, os: macos-15 }
          # GitHub's x64 Ubuntu image has Node.js, Python, Ruby and PHP: the macro tests must run
          # there instead of skipping a missing interpreter.
          - { name: linux-x64, os: ubuntu-24.04, require_interpreters: '1' }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      # GPUI (ume-ui) links the system libraries of the Linux desktop. The same list serves x64
      # and ARM64 (poc/gpui-textview/README.md).
      - name: Install the packages that GPUI needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang cmake \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
        env:
          UME_REQUIRE_INTERPRETERS: ${{ matrix.require_interpreters }}
