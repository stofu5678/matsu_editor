name: E2E

# Starts the real `matsu` program on the five targets of ci.yml: a startup macro types text, saves the
# file and quits, and the test checks the saved bytes (crates/matsu/tests/e2e_smoke.rs). The tests
# of ci.yml run inside GPUI's test platform and never start the executable.
#
# The `screens` job takes pictures of the same program (crates/matsu/tests/e2e_screens.rs) and, on
# Windows, drives its window with UI Automation (crates/matsu/tests/windows_uia.rs). The pictures
# are uploaded as the artifact `e2e-screens-<job name>` for people and AIs to look at; they are
# never compared with stored images. See docs/e2e-screens.md.

# To keep the runners free for other pull requests (the account has a limit of concurrent jobs),
# a pull request runs this workflow only when a file that it uses changes, not as a draft, and
# on fewer targets: `smoke` on all but linux-arm64, `screens` on windows-x64 and macos-arm64 only.
# A push to main (or a manual run) runs all five targets of both jobs.
on:
  push:
    branches: [main]
  # A manual run (`gh workflow run e2e.yml --ref <branch>`) uses all five targets, like a push to
  # main: it is how a change to this workflow is tried on every runner before the pull request.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - rust-toolchain.toml
      - scripts/e2e-screens.sh
      - scripts/windows-clear-privacy-screen.ps1
      - scripts/mac-checks/**
      - .github/workflows/e2e.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"windows-arm64","os":"windows-11-arm","rustflags":"-D warnings -C target-feature=+crt-static"},{"name":"windows-x64","os":"windows-2025","rustflags":"-D warnings -C target-feature=+crt-static"},{"name":"macos-arm64","os":"macos-15","rustflags":"-D warnings"},{"name":"linux-x64","os":"ubuntu-24.04","rustflags":"-D warnings"}]' || '[{"name":"windows-arm64","os":"windows-11-arm","rustflags":"-D warnings -C target-feature=+crt-static"},{"name":"windows-x64","os":"windows-2025","rustflags":"-D warnings -C target-feature=+crt-static"},{"name":"macos-arm64","os":"macos-15","rustflags":"-D warnings"},{"name":"linux-x64","os":"ubuntu-24.04","rustflags":"-D warnings"},{"name":"linux-arm64","os":"ubuntu-24.04-arm","rustflags":"-D warnings"}]') }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    # A normal run takes 5 to 15 minutes (the build is most of it). Each test of the smoke file
    # stops the editor after 120 seconds, so a hang that gets here is in the build, in a step
    # that is not the test, or in the runner. (The one-hour "hang" of smoke (macos-arm64) on
    # #194 was no hang: the job never got a runner, GitHub cancelled it after an hour in the
    # queue, and its log has no steps.)
    timeout-minutes: 30
    # RUSTFLAGS in the environment replaces `rustflags` of .cargo/config.toml, which links the C
    # runtime statically on Windows (MSVC). The Windows jobs repeat that flag, so that E2E starts
    # the program as it is shipped (package.yml does not set RUSTFLAGS) and not one that needs the
    # Visual C++ Redistributable.
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      # The same list as ci.yml (GPUI links the system libraries of the Linux desktop), and a
      # window to show it in: Xvfb is a virtual X server, and lavapipe (mesa-vulkan-drivers) is a
      # Vulkan driver that draws on the CPU, because a runner has no GPU.
      - name: Install the packages that GPUI needs and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang cmake \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev \
            xvfb mesa-vulkan-drivers libvulkan1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      # `matsu-script` runs the macros of the bundled engines; the editor looks for it next to its own
      # executable (crates/matsu-plugin/src/session.rs), so both are built in the same profile.
      - run: cargo build --release --locked -p matsu -p matsu-script
      - name: Run the E2E tests
        if: runner.os != 'Linux'
        run: cargo test --release --locked -p matsu --test e2e_smoke -- --ignored --test-threads=1 --nocapture
      - name: Run the E2E tests (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" cargo test --release --locked -p matsu --test e2e_smoke -- --ignored --test-threads=1 --nocapture

  screens:
    name: screens (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"windows-x64","os":"windows-2025","rustflags":"-D warnings -C target-feature=+crt-static"},{"name":"macos-arm64","os":"macos-15","rustflags":"-D warnings"}]' || '[{"name":"windows-arm64","os":"windows-11-arm","rustflags":"-D warnings -C target-feature=+crt-static"},{"name":"windows-x64","os":"windows-2025","rustflags":"-D warnings -C target-feature=+crt-static"},{"name":"macos-arm64","os":"macos-15","rustflags":"-D warnings"},{"name":"linux-x64","os":"ubuntu-24.04","rustflags":"-D warnings"},{"name":"linux-arm64","os":"ubuntu-24.04-arm","rustflags":"-D warnings"}]') }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # As in the smoke job: the static C runtime on Windows, like the shipped packages.
      RUSTFLAGS: ${{ matrix.rustflags }}
      MATSU_E2E_PLATFORM: ${{ matrix.name }}
      MATSU_E2E_SCREENS_DIR: ${{ github.workspace }}/e2e-screens
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      # The packages of the smoke job, ImageMagick (`import` saves the picture of the virtual
      # display as a PNG) and Noto Sans CJK: a Linux runner has no Japanese font, and the text of
      # the pictures would be boxes.
      - name: Install the packages that GPUI needs, a virtual display, ImageMagick and a Japanese font
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang cmake \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev \
            xvfb mesa-vulkan-drivers libvulkan1 imagemagick fonts-noto-cjk
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release --locked -p matsu -p matsu-script
      - run: mkdir -p "$MATSU_E2E_SCREENS_DIR"
      # The windows-11-arm runners show the "Choose privacy settings" screen of Windows over the
      # desktop. The script sets the policy that turns it off, closes it, and saves pictures of
      # the desktop before and after (they go into the artifact).
      - name: Clear the privacy screen of Windows
        if: matrix.name == 'windows-arm64'
        shell: pwsh
        run: ./scripts/windows-clear-privacy-screen.ps1 "$env:MATSU_E2E_SCREENS_DIR"
      - name: Take the pictures
        if: runner.os != 'Linux'
        run: cargo test --release --locked -p matsu --test e2e_screens -- --ignored --test-threads=1 --nocapture
      - name: Take the pictures (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" cargo test --release --locked -p matsu --test e2e_screens -- --ignored --test-threads=1 --nocapture
      # The window is on the interactive desktop of the runner; UI Automation drives it by the
      # accessibility names, and a picture is saved at each step.
      - name: Drive the window with UI Automation
        if: runner.os == 'Windows' && !cancelled()
        run: cargo test --release --locked -p matsu --test windows_uia -- --ignored --test-threads=1 --nocapture
      # macOS: System Events (AppleScript) drives the window through the Accessibility API. GitHub's
      # macOS runners already give osascript and bash the Accessibility and Screen Recording
      # permissions (docs/e2e-screens.md).
      - name: Drive the window with the Accessibility API
        if: runner.os == 'macOS' && !cancelled()
        run: cargo test --release --locked -p matsu --test macos_ax -- --ignored --test-threads=1 --nocapture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screens-${{ matrix.name }}
          path: e2e-screens/*.png
          if-no-files-found: warn
          retention-days: 14
