name: Package check

# Proves the packaging on all five targets when the release files change.
# Nothing is published from a pull request.

on:
  pull_request:
    paths:
      - .cargo/config.toml
      - .github/scripts/pe_imports.py
      - .github/scripts/test-windows-installer.ps1
      - packaging/windows/**
      - crates/matsu/matsu.rc
      - crates/matsu/build.rs
      - scripts/package-mac-app.sh
      - scripts/package-mac-dmg.sh
      - scripts/check-mac-dmg.sh
      - scripts/package-linux.sh
      - packaging/linux/**
      - packaging/homebrew/**
      - packaging/scoop/**
      - packaging/winget/**
      - tools/packaging/**
      - .github/scripts/test-linux-install.sh
      - .github/scripts/test-rpm-in-fedora.sh
      - .github/scripts/apt-install.sh
      - assets/icons/**
      - .github/actions/mac-runner/**
      - .github/workflows/package.yml
      - .github/workflows/package-check.yml
      - .github/workflows/release.yml
      - Cargo.toml
      - release-please-config.json
      - .release-please-manifest.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    uses: ./.github/workflows/package.yml

  # The package-manager files (ADR-0032): Homebrew cask, Scoop manifest, winget manifests. They parse, the winget
  # files pass Microsoft's schemas, the files agree with each other and with matsu.iss, and the script that fills a
  # release into them works on fake assets. Runs on a GitHub runner and needs nothing of the self-hosted Mac. The cask
  # is checked for Ruby syntax only: `brew style` would need Homebrew and its RuboCop gems on a macOS runner.
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the checkers
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.3 jsonschema==4.26.0
      - name: Check the files
        run: |
          "$RUNNER_TEMP/venv/bin/python" tools/packaging/check-manifests.py
          ruby -c packaging/homebrew/matsu-editor.rb
      - name: Fill a fake release into a copy and check it again
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/manifests"
          mkdir -p "$work/assets" "$work/root"
          cp -r packaging "$work/root/packaging"
          for n in windows-x64.zip windows-arm64.zip windows-x64-setup.exe windows-arm64-setup.exe macos-arm64.dmg; do
            echo "fake $n" > "$work/assets/matsu-v9.8.7-$n"
          done
          python3 tools/packaging/update-manifests.py 9.8.7 --assets-dir "$work/assets" --root "$work/root"
          "$RUNNER_TEMP/venv/bin/python" tools/packaging/check-manifests.py --root "$work/root"
          grep -q "$(sha256sum "$work/assets/matsu-v9.8.7-windows-x64-setup.exe" | cut -d' ' -f1)" "$work/root/packaging/winget/stofu5678.MATSUEditor.installer.yaml"

  # The Windows installer must not touch the user's data (ADR-0032, decision 3): install, update and uninstall it
  # on the two Windows targets and compare. The script is .github/scripts/test-windows-installer.ps1.
  installer-test:
    name: installer test (${{ matrix.name }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-2025 }
          - { name: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Cone mode takes folders; the files in the root (Cargo.toml) come with it.
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: package-${{ matrix.name }}
          path: dist
      - name: Install, update and uninstall
        shell: pwsh
        run: .github/scripts/test-windows-installer.ps1 -Setup "dist/matsu-${{ matrix.name }}-setup.exe"
      - name: Keep the installer's log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/installer-logs
          if-no-files-found: ignore
          retention-days: 3
