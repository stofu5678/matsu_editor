name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main.
# Release automation reads it as a Conventional Commit.
# pull_request, not pull_request_target: the check only reads the PR title, and
# the read-only token that a PR from a fork gets is enough for a public
# repository. GitHub blocks pull_request_target by default in public
# repositories from 2026-12-02. Never check out or run PR code in this workflow.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-24.04
    # It takes seconds; the limit replaces GitHub's default of 6 hours (as in the other workflows).
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
