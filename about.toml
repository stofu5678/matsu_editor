# cargo-about: generates THIRD_PARTY_NOTICES.txt (template: about.hbs). See the section
# "Third-party notices" in README.md.
#
# `accepted` is deny.toml's [licenses] allow list, in the same order. It is the policy: add nothing
# here that deny.toml does not allow. cargo-about uses the first license of a crate's "A OR B"
# expression that is in this list.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "bzip2-1.0.6",
    "MPL-2.0",
]

# Every target that CI builds (.github/workflows/ci.yml). Crates that only a target we do not
# build uses (Android, wasm, ...) are left out.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# Dev-dependencies (test helpers) never reach the programs, so they are left out. Build-dependencies
# are kept on purpose: most are tools that run on the build machine (cc, bindgen, pkg-config), but
# some carry code that is compiled into the programs (lua-src is the C source of Lua, a
# build-dependency of mlua-sys), and cargo-about cannot tell the two apart. The cost is a few extra
# notices. Proc-macro crates are build-time only too and stay for the same reason.
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Clarifications. Each one names the license files by checksum, so a crate update that changes a
# file makes cargo-about fall back to its own search (and the CI job shows the difference).
# Crate-specific tables must stay below the global options.

# The Rust crates of this repository: our own license (LICENSE-MIT, next to LICENSE-APACHE).
