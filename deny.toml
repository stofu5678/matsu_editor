# cargo-deny: licenses, security advisories, and dependency sources.
# CLAUDE.md forbids GPL-family dependencies; only the licenses below pass.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "bzip2-1.0.6",
    # File-level copyleft: modified MPL files must be published, the rest of
    # the app need not be. Used by GPUI's dependencies (dwrote, option-ext).
    "MPL-2.0",
]
confidence-threshold = 0.9
# The list is the policy, not only what is in use today.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
