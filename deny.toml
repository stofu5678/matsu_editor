# cargo-deny: licenses, security advisories, and dependency sources.
# CLAUDE.md forbids GPL-family dependencies; only the licenses below pass.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Crates that GPUI and gpui-component use and that their authors no longer maintain. They are
# notices, not vulnerabilities (none of them has a RUSTSEC advisory about a flaw). Each entry
# goes when GPUI or gpui-component stops using the crate. Ignored by ID, so a new advisory on any
# of them still fails.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, used by gpui-base (gpui-component)" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, used by gpui-component and pulp (exr)" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: unmaintained, used by gpui-pre-reqwest (gpui-kit-assets)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, used by usvg (gpui-pre, gpui-component)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, used by GPUI's font stack (cosmic-text, usvg)" },
    # zbus 6 took these parts of zbus 5 in. GPUI (ashpd, atspi) and gpui-base (ashpd) use zbus 5,
    # and ume-platform uses the zbus that GPUI uses: it moves to zbus 6 with GPUI.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, part of zbus 5 (GPUI, gpui-base, ume-platform)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, part of zbus 5 (GPUI, gpui-base, ume-platform)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, part of zbus 5 (GPUI, gpui-base, ume-platform)" },
]

[licenses]
version = 2
# One exception that this check does not see: wayland-protocols-plasma is MIT, but its code is
# generated from KDE's protocol definitions (LGPL-2.1-or-later). CLAUDE.md ("ライセンスのルール")
# records the decision; THIRD_PARTY_NOTICES.txt carries the LGPL text (about.toml).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # The older version of Unicode-3.0 (regex-syntax's Unicode tables; the user allowed it on 2026-10-17).
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "bzip2-1.0.6",
    # File-level copyleft: modified MPL files must be published, the rest of
    # the app need not be. Used by GPUI's dependencies (dwrote, option-ext).
    "MPL-2.0",
]
confidence-threshold = 0.9
# The list is the policy, not only what is in use today.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
