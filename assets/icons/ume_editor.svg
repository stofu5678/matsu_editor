<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f4f7"/>
    </linearGradient>
    <radialGradient id="petal" cx="0.5" cy="0.75" r="0.8">
      <stop offset="0" stop-color="#fde4ec"/>
      <stop offset="0.55" stop-color="#f48fb1"/>
      <stop offset="1" stop-color="#e0457b"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <g id="blossom">
      <g fill="url(#petal)" stroke="#c2185b" stroke-width="1.5">
        <circle cx="0" cy="-24" r="21"/>
        <circle cx="0" cy="-24" r="21" transform="rotate(72)"/>
        <circle cx="0" cy="-24" r="21" transform="rotate(144)"/>
        <circle cx="0" cy="-24" r="21" transform="rotate(216)"/>
        <circle cx="0" cy="-24" r="21" transform="rotate(288)"/>
      </g>
      <circle r="10" fill="#c2185b" opacity="0.85"/>
      <g stroke="#f2b632" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-17"/>
        <line x1="0" y1="0" x2="0" y2="-17" transform="rotate(40)"/>
        <line x1="0" y1="0" x2="0" y2="-17" transform="rotate(80)"/>
        <line x1="0" y1="0" x2="0" y2="-17" transform="rotate(120)"/>
        <line x1="0" y1="0" x2="0" y2="-17" transform="rotate(160)"/>
        <line x1="0" y1="0" x2="0" y2="-17" transform="rotate(200)"/>
        <line x1="0" y1="0" x2="0" y2="-17" transform="rotate(240)"/>
        <line x1="0" y1="0" x2="0" y2="-17" transform="rotate(280)"/>
        <line x1="0" y1="0" x2="0" y2="-17" transform="rotate(320)"/>
      </g>
      <g fill="#ffd54f">
        <circle cx="0" cy="-18" r="2.8"/>
        <circle cx="0" cy="-18" r="2.8" transform="rotate(40)"/>
        <circle cx="0" cy="-18" r="2.8" transform="rotate(80)"/>
        <circle cx="0" cy="-18" r="2.8" transform="rotate(120)"/>
        <circle cx="0" cy="-18" r="2.8" transform="rotate(160)"/>
        <circle cx="0" cy="-18" r="2.8" transform="rotate(200)"/>
        <circle cx="0" cy="-18" r="2.8" transform="rotate(240)"/>
        <circle cx="0" cy="-18" r="2.8" transform="rotate(280)"/>
        <circle cx="0" cy="-18" r="2.8" transform="rotate(320)"/>
      </g>
    </g>
  </defs>
  <g filter="url(#shadow)">
  <g transform="translate(20 21) scale(0.86)">
    <!-- 後ろの紙（2枚） -->
    <g transform="translate(4 4)"><rect x="40" y="30" width="176" height="204" rx="14" fill="#e9ebf0" stroke="#b9bec9" stroke-width="2"/></g>
    <g transform="translate(-2 -2)"><rect x="40" y="30" width="176" height="204" rx="14" fill="#f4f5f8" stroke="#b9bec9" stroke-width="2"/></g>
    <!-- いちばん上の紙 -->
    <g transform="translate(-8 -8)">
    

  <!-- メモ帳本体 -->
  <g>
    <rect x="40" y="30" width="176" height="204" rx="14" fill="url(#paper)" stroke="#c5c9d2" stroke-width="2"/>
  </g>
  <!-- 上部の綴じ帯 -->
  <path d="M40 44 a14 14 0 0 1 14 -14 h148 a14 14 0 0 1 14 14 v20 h-176 z" fill="#8e2448"/>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="74" cy="47" r="5"/><circle cx="106" cy="47" r="5"/>
    <circle cx="138" cy="47" r="5"/><circle cx="170" cy="47" r="5"/>
    
  </g>
  <!-- 罫線 -->
  <g stroke="#cfd6e3" stroke-width="2.5" stroke-linecap="round">
    <line x1="58" y1="90"  x2="198" y2="90"/>
    <line x1="58" y1="114" x2="198" y2="114"/>
    <line x1="58" y1="138" x2="198" y2="138"/>
    <line x1="58" y1="162" x2="198" y2="162"/>
    <line x1="58" y1="186" x2="198" y2="186"/>
    <line x1="58" y1="210" x2="198" y2="210"/>
  </g>
  <!-- 梅の枝 -->
  <path d="M52 222 C 84 206, 104 196, 122 176 S 160 132, 206 108"
        fill="none" stroke="#5d4037" stroke-width="7" stroke-linecap="round"/>
  <path d="M110 188 C 96 170, 92 156, 94 140"
        fill="none" stroke="#5d4037" stroke-width="4.5" stroke-linecap="round"/>
  <!-- つぼみ -->
  <circle cx="94" cy="134" r="8" fill="#e0457b" stroke="#c2185b" stroke-width="1.5"/>
  <circle cx="206" cy="104" r="7" fill="#e0457b" stroke="#c2185b" stroke-width="1.5"/>
  <!-- 花 -->
  <use href="#blossom" transform="translate(150 146)"/>
  <use href="#blossom" transform="translate(78 200) scale(0.55) rotate(20)"/>

    <rect x="70" y="18" width="8" height="34" rx="4" fill="none" stroke="#6b7280" stroke-width="3.5"/><rect x="102" y="18" width="8" height="34" rx="4" fill="none" stroke="#6b7280" stroke-width="3.5"/><rect x="134" y="18" width="8" height="34" rx="4" fill="none" stroke="#6b7280" stroke-width="3.5"/><rect x="166" y="18" width="8" height="34" rx="4" fill="none" stroke="#6b7280" stroke-width="3.5"/>
    </g>
  </g>
  </g>
</svg>