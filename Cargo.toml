[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# third_party/ holds vendored copies of crates (see third_party/gpui-pre-windows/MATSU-CHANGES.md). They are
# used through [patch.crates-io] below and are not members.
exclude = ["third_party"]

# GPUI's Windows backend with the glyph upload through a staging texture (ADR-0004): without it, the
# Qualcomm Adreno driver keeps about 4 MB per glyph upload. Re-apply on every GPUI upgrade; see
# third_party/gpui-pre-windows/MATSU-CHANGES.md.
[patch.crates-io]
gpui-pre-windows = { path = "third_party/gpui-pre-windows" }

[workspace.package]
version = "0.26.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stofu5678/matsu_editor"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
ref_option = "warn"
implicit_clone = "warn"
needless_collect = "warn"

# Release binaries ship without symbols (about 30% smaller; see docs/release.md).
# Panics still unwind. To keep symbols, see docs/release.md.
[profile.release]
strip = true
