[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stofu5678/matsu_editor"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release binaries ship without symbols (about 30% smaller; see docs/release.md).
# Panics still unwind. To keep symbols, see docs/release.md.
[profile.release]
strip = true
